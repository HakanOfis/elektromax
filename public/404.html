<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Elektromax</title>
    <script>
      // GitHub Pages SPA routing trick
      // Redirect all 404s back to index.html with the path encoded as a query param
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/?p=' + encodeURIComponent(l.pathname + l.search) + l.hash
      );
    </script>
  </head>
  <body></body>
</html>
